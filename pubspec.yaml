name: dispute_workspace
description: A cross-platform client for Nostr
publish_to: none

environment:
  sdk: ^3.11.0

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

workspace:
  - apps/shell
  - apps/dispute
  - apps/zeronet
  - packages/plugin_interface
  - packages/nostr

dev_dependencies:
  melos: ^7.4.0

melos:
  scripts:
    analyze:
      exec: fvm dart analyze .
      description: Run dart analyze in all packages
    test:
      exec: fvm flutter test
      description: Run tests in all packages
      packageFilters:
        dirExists: test
    format:
      exec: fvm dart format .
      description: Format all packages
    codegen:
      exec: fvm dart run build_runner build --delete-conflicting-outputs
      description: Regenerate Drift code
      packageFilters:
        dependsOn:
          - build_runner
    clean:
      exec: fvm flutter clean
      description: Clean all packages
    run:shell:
      run: cd apps/shell && fvm flutter run
      description: Run the shell app (all plugins)
    run:dispute:
      run: cd apps/dispute && fvm flutter run
      description: Run the dispute app standalone
    run:zeronet:
      run: cd apps/zeronet && fvm flutter run
      description: Run the zeronet app standalone
